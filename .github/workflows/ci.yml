name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: PYTHONPATH=. python -m unittest discover -s tests -v
      - run: PYTHONPATH=. python -m src.preprocessor --input examples --output outputs/ci --config config.json
      - run: |
          python - <<'PY'
          import pathlib
          from openpyxl import load_workbook
          for path in pathlib.Path('outputs').rglob('*.xlsx'):
              load_workbook(path, read_only=True).close()
          PY
      - run: '! grep -R --include="*.py" --include="*.json" -E "sk-[A-Za-z0-9]{12,}|ghp_[A-Za-z0-9]{20,}" .'
      - run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('package-smoke.zip', 'w') as z: z.write('README.md')
          with zipfile.ZipFile('package-smoke.zip') as z: assert z.namelist() == ['README.md']
          PY
